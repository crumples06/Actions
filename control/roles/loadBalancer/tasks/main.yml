---
# tasks file for roles/loadBalancer

- name: Install nginx
  apt:
    name: nginx
    state: present
  become: true

- name: Deploy nginx config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  become: true
  notify: reload nginx

  
- name: Start nginx
  service:
    name: nginx
    state: started
    enabled: true
  become: true