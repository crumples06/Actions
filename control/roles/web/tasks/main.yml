---
# tasks file for roles/web
- name: Install nginx
  apt:
    name: nginx
    state: present
  become: true

- name: deploy webpage
  template: 
    src: index.html.j2
    dest: /var/www/html/index.html
  become: true

- name: Start nginx
  service:
    name: nginx
    state: started
    enabled: true
  become: true

