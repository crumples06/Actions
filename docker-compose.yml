services:
  web1:
    build: .
    expose:
      - 22
    networks:
      - ansible_net
    container_name: web1

  web2:
    build: .
    expose:
      - 22
    networks:
      - ansible_net
    container_name: web2


  control:
    image: python:3.11-slim
    working_dir: /work
    volumes:
      - ./control:/work
    networks:
      - ansible_net
    container_name: control
    stdin_open: true
    tty: true
    command: >
      bash -c "apt-get update && apt-get install -y sshpass curl && pip install ansible && bash"
    healthcheck:
      test: ["CMD-SHELL", "command -v ansible >/dev/null && command -v curl >/dev/null && command -v sshpass >/dev/null"]
      interval: 10s
      timeout: 1m
      retries: 6
      start_period: 30s

  loadbalancer:
    build: .
    networks:
      - ansible_net
    container_name: loadbalancer

  db:
    build: .
    networks:
      - ansible_net
    container_name: db

networks:
  ansible_net:
    
  