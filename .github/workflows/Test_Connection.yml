name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services 
        run: docker compose up --build --wait

      - name: Write vault password file
        run: echo "{{ secrets.ANSIBLE_VAULT_PASSWORD }}" > control/vault_pass.txt 

      - name: Run ansible playbook
        run: docker exec control ansible-playbook -i inventory.ini playbook.yaml --vault-password-file vault_pass.txt

      - name: Verify load balancing
        run: |
          rm -f /tmp/results.txt
          for i in $(seq 1 10); do 
            echo "Request $i"
            docker exec control curl -sS loadbalancer >> /tmp/results.txt
          done
          grep -q "web1" /tmp/results.txt && grep -q "web2" /tmp/results.txt

      - name: Tear down
        if: always()
        run: docker compose down
