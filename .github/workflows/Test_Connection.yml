name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore SSH keys
        run: |
          mkdir -p control/ssh_keys
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > control/ssh_keys/ansible_hardening_key
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_PUBLIC_KEY }}" > control/ssh_keys/ansible_hardening_key.pub
          chmod 600 control/ssh_keys/ansible_hardening_key

      - name: Build and start services 
        run: docker compose up --build --wait

      - name: Write vault password files
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: echo "$VAULT_PASSWORD" > control/vault_pass.txt

      - name: Run ansible playbook
        run: docker exec control ansible-playbook -i inventory.ini playbook.yaml --vault-password-file vault_pass.txt

      - name: Verify load balancing
        run: |
          rm -f /tmp/results.txt
          for i in $(seq 1 10); do 
            echo "Request $i"
            docker exec control curl -sS loadbalancer >> /tmp/results.txt
          done
          grep -q "web1" /tmp/results.txt && grep -q "web2" /tmp/results.txt

      - name: Tear down
        if: always()
        run: docker compose down
